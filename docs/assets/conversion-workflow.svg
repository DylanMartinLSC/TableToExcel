<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="255" viewBox="0 0 1100 255" role="img" aria-labelledby="title desc"><title id="title">Your first conversion</title><desc id="desc">Choose images or PDFs, extract tables, review and correct cells, then download Excel or CSV. If a table is missing, crop or enable borderless detection and extract again.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#42878a"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f2f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="30" y="35" width="215" height="85" rx="12" fill="#e1efed" stroke="#92bdb9"/><text x="137.5" y="72.5" text-anchor="middle" font-size="17" fill="#163d47">1 · Choose files</text><text x="137.5" y="94.5" text-anchor="middle" font-size="17" fill="#163d47">Images or PDFs</text><path d="M245 77 H295" fill="none" stroke="#42878a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="305" y="35" width="215" height="85" rx="12" fill="#e1efed" stroke="#92bdb9"/><text x="412.5" y="72.5" text-anchor="middle" font-size="17" fill="#163d47">2 · Extract</text><text x="412.5" y="94.5" text-anchor="middle" font-size="17" fill="#163d47">Find table cells</text><path d="M520 77 H570" fill="none" stroke="#42878a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="580" y="35" width="215" height="85" rx="12" fill="#e1efed" stroke="#92bdb9"/><text x="687.5" y="72.5" text-anchor="middle" font-size="17" fill="#163d47">3 · Review</text><text x="687.5" y="94.5" text-anchor="middle" font-size="17" fill="#163d47">Correct the results</text><path d="M795 77 H845" fill="none" stroke="#42878a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="855" y="35" width="215" height="85" rx="12" fill="#185b60" stroke="#92bdb9"/><text x="962.5" y="72.5" text-anchor="middle" font-size="17" fill="#ffffff">4 · Download</text><text x="962.5" y="94.5" text-anchor="middle" font-size="17" fill="#ffffff">Excel or CSV</text><rect x="305" y="164" width="490" height="58" rx="12" fill="#e1efed" stroke="#92bdb9"/><text x="550.0" y="199.0" text-anchor="middle" font-size="17" fill="#163d47">Missing a table? Crop or try borderless detection.</text><path d="M412 164 V130" fill="none" stroke="#42878a" stroke-width="2.5" marker-end="url(#arrow)"/></g></svg>