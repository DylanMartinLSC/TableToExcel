<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">How the local converter works</title><desc id="desc">Files are validated, rendered and deskewed. OpenCV detects table structure while Tesseract reads a rule-free copy. Results combine into editable tables, then export as Excel or CSV.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#42878a"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f2f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="360" y="25" width="380" height="65" rx="12" fill="#e1efed" stroke="#92bdb9"/><text x="550.0" y="63.5" text-anchor="middle" font-size="17" fill="#163d47">Image or PDF on your device</text><rect x="360" y="120" width="380" height="65" rx="12" fill="#e1efed" stroke="#92bdb9"/><text x="550.0" y="158.5" text-anchor="middle" font-size="17" fill="#163d47">Validate, render and deskew</text><path d="M550 90 V110" fill="none" stroke="#42878a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="235" width="440" height="85" rx="12" fill="#e1efed" stroke="#92bdb9"/><text x="270.0" y="272.5" text-anchor="middle" font-size="17" fill="#163d47">img2table + OpenCV</text><text x="270.0" y="294.5" text-anchor="middle" font-size="17" fill="#163d47">Detect table structure</text><rect x="610" y="235" width="440" height="85" rx="12" fill="#e1efed" stroke="#92bdb9"/><text x="830.0" y="272.5" text-anchor="middle" font-size="17" fill="#163d47">Rule-free copy → Tesseract</text><text x="830.0" y="294.5" text-anchor="middle" font-size="17" fill="#163d47">Read printed text on CPU</text><path d="M550 185 V205 H270 V225" fill="none" stroke="#42878a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M550 205 H830 V225" fill="none" stroke="#42878a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="330" y="365" width="440" height="65" rx="12" fill="#e1efed" stroke="#92bdb9"/><text x="550.0" y="403.5" text-anchor="middle" font-size="17" fill="#163d47">Combine cells, text and detected merges</text><path d="M270 320 V345 H430 V355" fill="none" stroke="#42878a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M830 320 V345 H670 V355" fill="none" stroke="#42878a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="330" y="465" width="440" height="65" rx="12" fill="#185b60" stroke="#92bdb9"/><text x="550.0" y="503.5" text-anchor="middle" font-size="17" fill="#ffffff">Review and edit in the local app</text><path d="M550 430 V455" fill="none" stroke="#42878a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="555" width="440" height="45" rx="12" fill="#e1efed" stroke="#92bdb9"/><text x="270.0" y="583.5" text-anchor="middle" font-size="17" fill="#163d47">Excel workbook (.xlsx)</text><rect x="610" y="555" width="440" height="45" rx="12" fill="#e1efed" stroke="#92bdb9"/><text x="830.0" y="583.5" text-anchor="middle" font-size="17" fill="#163d47">CSV files in a ZIP</text><path d="M550 530 V542 H270 V550" fill="none" stroke="#42878a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M550 542 H830 V550" fill="none" stroke="#42878a" stroke-width="2.5" marker-end="url(#arrow)"/></g></svg>