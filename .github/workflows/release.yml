name: Release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install uv==0.9.5 pyinstaller==6.16.0 build==1.3.0
      - name: Install application and native OCR
        run: |
          uv sync --frozen --no-dev --python 3.12
          uv pip install --python .venv/Scripts/python.exe pyinstaller==6.16.0
          choco install tesseract --version=5.4.0.20240606 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Tesseract installation failed' }
      - name: Build, smoke-test and zip
        run: .venv/Scripts/python.exe scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
