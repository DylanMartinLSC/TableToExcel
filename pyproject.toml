[project]
name = "tabletoexcel"
version = "0.1.0"
description = "Private, CPU-first image and PDF table conversion"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["streamlit>=1.40,<2", "img2table>=2.0,<3", "openpyxl>=3.1,<4", "Pillow>=11,<13", "pypdfium2>=4,<6"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ['.']
markers = ["integration: runs real CPU OCR"]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ['E4', 'E7', 'E9', 'F']

